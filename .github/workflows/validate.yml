name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository contract
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: Run skill tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s skills/hindsight-project-memory/tests -v
      - name: Compile Python helpers
        env:
          PYTHONPYCACHEPREFIX: /tmp/hindsight-project-memory-pycache
        run: python -m compileall -q skills/hindsight-project-memory/scripts
